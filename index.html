<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des points d'intérêt à Toulouse</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Marker Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <!-- Nos styles personnalisés -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="map"></div>
    
    <!-- Panneau de filtres -->
    <div class="filter-panel">
        <h3>Filtres</h3>
        <div class="filter-group">
            <label for="reseaux-filter">Rechercher par réseau porteur:</label>
            <input type="text" id="reseaux-filter" placeholder="Ex: ei, etti, aci...">
            <small class="hint">Séparer par des virgules pour plusieurs valeurs</small>
        </div>
        <div class="filter-stats">
            <span id="total-count">0</span> points affichés sur <span id="all-count">0</span>
        </div>
        <button id="reset-filter" class="btn-reset">Réinitialiser</button>
    </div>
    
    <div class="legend">
        <h3>Points d'intérêt à Toulouse</h3>
        <p>Carte des structures d'inclusion et services sociaux</p>
        <p><span style="color: #ff7800;">●</span> Points d'intérêt</p>
        <p><small>Données: structures-inclusion-2026-08-17.geojson</small></p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Marker Cluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <!-- Notre script -->
    <script src="app.js"></script>
</body>
</html>
